[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remindme-cli"
version = "0.1.0"
description = "Command line reminders with desktop notifications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
remindme = "remindme.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
